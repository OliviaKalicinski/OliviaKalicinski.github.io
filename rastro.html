<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rastro</title>
<style>
  :root{--tinta:#1b1816;--fraco:#8c867d;--linha:#e6e1d8;--caneta:#2b3fd4;--papel:#fdfcfa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);
    font:15px/1.6 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;padding:40px 22px 70px}
  .caixa{max-width:900px;margin:0 auto}
  h1{font-size:26px;font-weight:300;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--fraco);font-size:13.5px;margin:0 0 26px}
  form{display:flex;gap:8px;margin-bottom:26px}
  input{flex:1;max-width:280px;padding:9px 12px;border:1px solid var(--linha);border-radius:6px;
    background:#fff;font:inherit;font-size:14px}
  button{padding:9px 16px;border:1px solid var(--tinta);background:var(--tinta);color:#fff;
    border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
  button.vazio{background:#fff;color:var(--tinta)}
  .erro{color:#b3261e;font-size:13.5px;margin:0 0 20px}
  .cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:26px}
  .cartao{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
  .cartao .rot{font-size:12px;color:var(--fraco);margin-bottom:3px}
  .cartao .num{font-size:24px;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-weight:500;color:var(--fraco);font-size:11.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:0 10px 8px 0;border-bottom:1px solid var(--linha)}
  td{padding:9px 10px 9px 0;border-bottom:1px solid var(--linha);vertical-align:top}
  td.frouxo{color:var(--fraco)}
  .aviso{font-size:13px;color:var(--fraco);border-top:1px solid var(--linha);padding-top:14px;margin-top:26px}
  .tag{display:inline-block;background:#f1efe9;border-radius:4px;padding:1px 6px;font-size:12px;margin:0 3px 3px 0}
</style>

<div class="caixa">
  <h1>Rastro</h1>
  <p class="sub">Quem abriu o portfólio, de onde e o que olhou.</p>

  <form id="f">
    <input id="senha" type="password" placeholder="senha" autocomplete="off">
    <button type="submit">ver</button>
  </form>
  <p class="erro" id="erro" hidden></p>

  <div id="resumo" class="cartoes" hidden></div>
  <table id="tabela" hidden>
    <thead><tr><th>quando</th><th>de onde</th><th>etiqueta</th><th>abriu</th><th>tempo</th></tr></thead>
    <tbody id="corpo"></tbody>
  </table>
  <p class="aviso" id="aviso" hidden></p>
</div>

<script>
const API='https://hpwhheidyohyfhmpvwou.supabase.co/rest/v1/rpc/rastro_ler';
const CHAVE='sb_publishable_PtkHQ7RY_3tMBs8rlPt8RA_UfO91reX';

const f=document.getElementById('f'), erro=document.getElementById('erro');

function quando(iso){
  const d=new Date(iso), agora=new Date();
  const min=Math.round((agora-d)/60000);
  if(min<1) return 'agora';
  if(min<60) return min+' min atrás';
  if(min<1440) return Math.round(min/60)+'h atrás';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '
       + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function dura(s){ return s<60 ? s+'s' : Math.floor(s/60)+'m'+String(s%60).padStart(2,'0'); }

f.onsubmit=async e=>{
  e.preventDefault();
  const senha=document.getElementById('senha').value.trim();
  erro.hidden=true;
  if(!senha){ erro.textContent='Digite a senha.'; erro.hidden=false; return; }
  let linhas;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',
      'apikey':CHAVE,'Authorization':'Bearer '+CHAVE},body:JSON.stringify({p_senha:senha})});
    if(!r.ok) throw new Error('senha incorreta');
    linhas=await r.json();
  }catch(_){ erro.textContent='Senha incorreta.'; erro.hidden=false; return; }

  const n=linhas.length;
  const hoje=linhas.filter(l=>new Date(l.criado_em).toDateString()===new Date().toDateString()).length;
  const etiquetadas=linhas.filter(l=>l.campanha).length;
  const medianaSeg=(()=>{ const v=linhas.map(l=>l.segundos).sort((a,b)=>a-b);
    return v.length? v[Math.floor(v.length/2)] : 0; })();

  const resumo=document.getElementById('resumo');
  resumo.innerHTML=[['visitas',n],['hoje',hoje],['com etiqueta',etiquetadas],['tempo mediano',dura(medianaSeg)]]
    .map(([r,v])=>'<div class="cartao"><div class="rot">'+r+'</div><div class="num">'+v+'</div></div>').join('');
  resumo.hidden=false;

  document.getElementById('corpo').innerHTML = linhas.map(l=>
    '<tr><td>'+quando(l.criado_em)+'</td>'
    +'<td>'+(l.origem||'direto')+'</td>'
    +'<td>'+(l.campanha?'<span class="tag">'+l.campanha+'</span>':'<span class="frouxo">—</span>')+'</td>'
    +'<td>'+(l.aberturas&&l.aberturas.length ? l.aberturas.map(a=>'<span class="tag">'+a+'</span>').join('') : '<span class="frouxo">nada</span>')+'</td>'
    +'<td>'+dura(l.segundos)+'</td></tr>').join('');
  document.getElementById('tabela').hidden=false;

  const aviso=document.getElementById('aviso');
  aviso.textContent = n<30
    ? 'São '+n+' visitas. É pouco para tirar conclusão de origem ou de comportamento — leia linha a linha, não em média.'
    : n+' visitas. Já dá para olhar por origem, mas continue checando a linha, não só o total.';
  aviso.hidden=false;
  f.hidden=true;
};
</script>
