<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Olivia Kalicinski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<style>
/* ---- a régua da casa, do kinetic-proto: power4.out, ~16 quadros ---- */
@font-face{font-family:"Letra Olivia";src:url("LetraOlivia-Regular.otf") format("opentype");
  font-display:swap}
:root{
  --papel:#fcfcfb; --tinta:#17150f;
  --papelarte:#f8f0e4;        /* o creme da arte deitada */
  --disp:"Archivo",Impact,sans-serif;
  --nome:"Fraunces",Georgia,serif;
  --corpo:cubic-bezier(.23,1,.32,1);
  --dur:530ms;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--papel);color:var(--tinta);font-family:var(--disp);
  -webkit-font-smoothing:antialiased}

/* três faixas: nome em cima, desenho no meio, faixa embaixo */
.pagina{position:fixed;inset:0;display:grid;
  grid-template-rows:auto 1fr auto;
  background:var(--papel)}

.faixa{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:clamp(12px,2.4vh,22px) clamp(14px,4vw,34px);
  font-size:clamp(11px,2.9vw,14px);letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;transition:opacity var(--dur) var(--corpo)}
.faixa.alta{padding-top:clamp(26px,5.6vh,54px)}
.faixa.alta{font-family:var(--nome);font-weight:600;font-stretch:normal;
  font-variation-settings:"opsz" 110,"SOFT" 0,"WONK" 1;
  font-size:clamp(27px,6.6vw,44px);letter-spacing:-.012em;line-height:1;
  text-transform:none}
/* quando o nome virar a letra dela, é trocar o texto do h1 por <img src="nome.png"> */
.faixa.alta h1{margin:0;font-family:"Letra Olivia",cursive;font-weight:400;
  font-size:clamp(22px,4.8vh,38px);line-height:1;letter-spacing:0;color:#3a362d}
.faixa.alta small{display:block;font-family:var(--disp);font-size:clamp(9.5px,2.4vw,11px);
  font-weight:500;letter-spacing:.17em;text-transform:uppercase;opacity:.66;margin-top:12px}
.faixa.baixa{border-top:1px solid #ddd8c9;color:#59544a;flex-wrap:wrap;
  font-size:clamp(11px,2.8vw,12.5px);letter-spacing:.1em}
.faixa.baixa span{white-space:nowrap}
.faixa.baixa .cv{margin-left:clamp(10px,2.4vw,20px)}
.faixa a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}

/* o desenho mora no meio, inteiro, sem cortar */
.palco{position:relative;overflow:hidden;cursor:none}
.camada{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center;display:block;
  user-select:none;-webkit-user-drag:none}
/* a sala se dissolve no papel em vez de cortar em reta. A camada de cor
   soma duas mascaras: a mancha do cursor e esse esmaecimento de borda. */
:root{ --borda:radial-gradient(ellipse 74% 78% at 50% 50%, #000 30%, transparent 100%); }
.lapis{z-index:1;filter:saturate(.5) brightness(1.05);
  -webkit-mask-image:var(--borda);mask-image:var(--borda);
  -webkit-mask-size:var(--artw,100%) var(--arth,100%);mask-size:var(--artw,100%) var(--arth,100%);
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.cor{z-index:2;
  -webkit-mask-image:var(--mancha),var(--borda);mask-image:var(--mancha),var(--borda);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%,var(--artw,100%) var(--arth,100%);
  mask-size:100% 100%,var(--artw,100%) var(--arth,100%);
  -webkit-mask-position:center,center;mask-position:center,center}

.h{display:block}
.v{display:none}
@media (max-aspect-ratio:1/1){ .h{display:none} .v{display:block}
  :root{ --papelarte:#f0ecdc; }   /* o creme da arte em pé é outro */ }

/* o cursor desenhado: um círculo de lápis que segue o ponteiro */
.cursor{position:fixed;left:0;top:0;z-index:9;pointer-events:none;
  width:var(--d,34px);height:var(--d,34px);margin:calc(var(--d,34px) / -2) 0 0 calc(var(--d,34px) / -2);
  border:1.5px solid rgba(23,21,15,.55);border-radius:50%;
  transform:translate(var(--x,-100px), var(--y,-100px));
  transition:width var(--dur) var(--corpo), height var(--dur) var(--corpo),
             margin var(--dur) var(--corpo), border-color var(--dur) var(--corpo);
  opacity:0}
.cursor.on{opacity:1}
.cursor::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;
  margin:-1.5px 0 0 -1.5px;border-radius:50%;background:rgba(23,21,15,.6)}
/* sobre algo clicável o círculo abre e ganha anel duplo */
.cursor.porta{--d:66px;border-color:rgba(23,21,15,.8)}
.cursor.porta::before{content:"";position:absolute;inset:5px;border:1px solid rgba(23,21,15,.3);
  border-radius:50%}

/* as portas: áreas clicáveis por cima do desenho */
.porta{position:absolute;z-index:3;border:0;background:none;padding:0;cursor:none;
  font:inherit;color:inherit;min-width:44px;min-height:44px}
/* a janelinha: só aparece quando o ponteiro chega */
.porta .cartao{position:absolute;left:50%;bottom:calc(100% + 12px);
  transform:translateX(-50%) translateY(7px);
  background:var(--papelarte);
  border:14px solid transparent;
  border-image:url(casa/sala/moldura.png) 26 / 14px / 0 stretch;
  padding:3px 9px 5px;white-space:nowrap;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity 240ms var(--corpo), transform 240ms var(--corpo)}
.porta .cartao.baixo{top:calc(100% + 12px);bottom:auto;transform:translateX(-50%) translateY(-7px)}
.porta .cartao.esq{right:calc(100% + 12px);left:auto;top:50%;bottom:auto;
  transform:translateY(-50%) translateX(7px)}
.porta .cartao.dir{left:calc(100% + 12px);top:50%;bottom:auto;
  transform:translateY(-50%) translateX(-7px)}
.porta:hover .cartao,.porta:focus-visible .cartao,
.porta.aberta .cartao{opacity:1;transform:translateX(-50%)}
.porta:hover .cartao.esq,.porta:focus-visible .cartao.esq,
.porta:hover .cartao.dir,.porta:focus-visible .cartao.dir,
.porta.aberta .cartao.esq,.porta.aberta .cartao.dir{transform:translateY(-50%)}
.cartao b{display:block;font-family:var(--nome);font-size:17px;font-weight:600;
  letter-spacing:.005em;text-transform:none;line-height:1.1}
.cartao i{display:block;font-style:normal;margin-top:6px;font-size:11.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:#59544a;
  border-bottom:1px solid currentColor;padding-bottom:2px;width:max-content}


.porta:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}

/* o cogumelo do Joaquim: vive numa moldura do tamanho do palco, para herdar
   a mesma mancha do cursor que a camada de cor usa. o miolo tapa o quadro
   que estava desenhado ali, com o creme da propria camada. */
.colado{position:absolute;inset:0;z-index:1;pointer-events:none}
.colado.cor{z-index:2}
.colado .mat{position:absolute;width:0;height:0}
.colado .mat img{position:absolute;left:50%;top:50%;width:92%;
  transform:translate(-50%,-50%);display:block}
.colado.lapis.h .mat{background:#faf3e6}
.colado.cor.h   .mat{background:#f5e6d1}
.colado.lapis.v .mat{background:#f5f0e3}
.colado.cor.v   .mat{background:#f4eadb}
.colado.vazio{display:none}

/* com uma porta aberta, o nome e o subtitulo saem de cena */
.pagina.lendo .faixa.alta{opacity:0;pointer-events:none;
  height:0;min-height:0;padding-top:0;padding-bottom:0;overflow:hidden;
  transition:opacity var(--dur) var(--corpo), height var(--dur) var(--corpo),
             padding var(--dur) var(--corpo)}
.marcadas .porta{box-shadow:inset 0 0 0 1.5px rgba(220,0,90,.8)}

/* o dentro do quadrado: papel por cima, com a sala ainda aparecendo atrás */
.dentro{position:absolute;inset:0;z-index:12;overflow-y:auto;
  background:var(--papel);
  padding:clamp(58px,11vh,104px) clamp(20px,6vw,56px) clamp(30px,6vh,60px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--dur) var(--corpo), visibility 0s linear var(--dur)}
.dentro.no{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity var(--dur) var(--corpo), visibility 0s}
.dentro .folha{max-width:52ch;margin:0 auto}
/* a foto entra emoldurada a lapis, como um quadro apoiado na sala */
.dentro .quadro-foto{display:block;margin:0 0 clamp(16px,3vh,26px)}
.dentro .retrato{display:block;width:100%;height:auto}
@media (max-width:899px){
  .dentro .espelho.retrato-pequeno .quadro-foto{max-width:58%}
}
.dentro .retrato ~ p{font-size:clamp(13px,3.2vw,15px);line-height:1.55;color:#59544a}
.dentro h2{font-family:"Letra Olivia",cursive;font-weight:400;
  line-height:1.05;letter-spacing:0;color:#3a362d;
  font-size:clamp(30px,6.4vw,50px);margin:0 0 clamp(16px,3vh,26px)}
.dentro .folha.larga{max-width:72ch}
.dentro h3{font-family:var(--disp);font-weight:700;font-stretch:88%;
  font-size:14px;letter-spacing:.17em;text-transform:uppercase;color:#6b6558;
  margin:clamp(26px,4.5vh,40px) 0 clamp(10px,1.6vh,14px);
  padding-bottom:7px;border-bottom:1px solid #ddd6c5}
.dentro .linha{display:grid;grid-template-columns:9em 1fr;gap:clamp(10px,2.4vw,22px);
  margin:0 0 clamp(14px,2.4vh,20px)}
.dentro .quando{font-family:var(--disp);font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:#635e52;padding-top:6px;line-height:1.45}
.dentro .o-que b{display:block;font-family:var(--nome);font-weight:600;
  font-size:clamp(18px,4.4vw,23px);line-height:1.15;margin-bottom:5px}
.dentro .o-que p{margin:0}
.dentro .falta{color:#a59e8d;font-style:italic}
.dentro .chapeu{font-family:var(--nome);font-weight:500;font-size:clamp(16px,4vw,20px);
  line-height:1.42;color:#4b4639;margin:0 0 clamp(10px,2vh,18px)}
.dentro ul{margin:0 0 1.05em;padding:0;list-style:none}
.dentro ul li{position:relative;padding-left:1.1em;margin-bottom:.44em;
  font-family:var(--disp);font-size:clamp(15px,3.6vw,16px);line-height:1.55;color:#3a362d}
.dentro ul li::before{content:"–";position:absolute;left:0;color:#8b8577}
.dentro .fecho{font-family:var(--nome);font-weight:400;font-size:clamp(15px,3.8vw,18px);
  line-height:1.5;color:#4b4639;margin:.2em 0 0}
.dentro a{color:inherit;text-decoration:none;border-bottom:1px solid #b9b2a1}
.dentro a:hover{border-color:currentColor}
.dentro .onde{font-family:var(--disp);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#635e52;margin:-2px 0 9px}
@media (max-width:620px){ .dentro .linha{grid-template-columns:1fr;gap:4px} }
.dentro p{font-family:var(--disp);font-weight:400;font-stretch:normal;
  font-size:clamp(14px,3.6vw,17px);line-height:1.62;color:#3a362d;margin:0 0 1.05em;
  letter-spacing:0;text-transform:none}
/* no computador a porta e uma pagina de revista: nao rola, a foto ocupa uma
   coluna e o texto corre na outra, justificado. A porta Olivia e o CV ficam
   de fora porque sao longos e precisam rolar. */
@media (min-width:900px) and (min-height:560px) and (hover:hover){
  .dentro.revista{overflow:hidden}
  .dentro.revista .folha{max-width:min(100%,1180px);width:100%;height:100%;
    display:grid;grid-template-rows:auto 1fr;gap:0}
  .dentro.revista h2{margin-bottom:clamp(14px,2.4vh,26px)}
  .dentro.revista .espelho.retrato-pequeno{grid-template-columns:.30fr 1fr;align-items:start}
  .dentro.revista .espelho.retrato-pequeno .quadro-foto{height:auto}
  .dentro.revista .espelho.retrato-pequeno .corpo{columns:2}
  .dentro.revista .espelho{display:grid;grid-template-columns:1.15fr .85fr;
    gap:clamp(28px,3.8vw,56px);align-items:start;min-height:0;overflow:hidden}
  .dentro.revista .espelho{align-items:stretch}
  .dentro.revista .espelho .quadro-foto{margin:0;height:100%;min-height:0;
    display:flex;box-sizing:border-box}
  .dentro.revista .espelho .retrato{height:100%;min-height:0;object-fit:contain}
  .dentro.revista .corpo{text-align:justify;hyphens:auto;-webkit-hyphens:auto;
    column-gap:clamp(26px,3.4vw,46px)}
  .dentro.revista .corpo p:first-child{font-size:clamp(17px,1.5vw,21px);line-height:1.45}
  .dentro.revista .corpo p:first-child::first-letter{float:left;font-family:var(--nome);
    font-weight:650;font-size:3.1em;line-height:.82;padding:.06em .09em 0 0;color:var(--tinta)}
  /* porta sem foto: o texto abre em duas colunas, como pagina de revista */
  .dentro.revista .espelho.sem-foto{grid-template-columns:1fr}
  .dentro.revista .espelho.sem-foto .corpo{columns:2}
  .dentro.revista .espelho.sem-foto .corpo p:first-child{font-size:inherit;line-height:1.62}
  .dentro.revista .espelho.sem-foto .corpo p:first-child::first-letter{font-size:3.4em}
}
.dentro .corpo p:last-child{margin-bottom:0}
/* a galeria vem depois da pagina de texto: a porta rola a partir dela */
.dentro.com-galeria{overflow-y:auto}
.dentro.com-galeria .folha{height:auto}
.dentro.com-galeria .espelho{min-height:calc(100vh - 240px)}
/* colunas em vez de grade: cada peca ocupa a altura que tem, sem buraco branco */
.galeria{columns:2 210px;column-gap:clamp(12px,1.8vw,22px);
  margin:clamp(40px,7vh,72px) 0 0;padding-top:clamp(26px,4vh,40px);
  border-top:1px solid #e2dccb}
.obra{break-inside:avoid;position:relative;margin:0 0 clamp(12px,1.8vw,22px);
  display:block;width:100%;border:0;padding:0;background:none;cursor:pointer}
.obra img{display:block;width:100%;height:auto}
.obra.par img{aspect-ratio:5/3;object-fit:contain;background:#fcfcfb}
.obra figcaption{position:absolute;inset:auto 0 0 0;
  font-family:var(--disp);font-size:12px;line-height:1.45;text-align:left;
  color:#2b2821;background:rgba(250,249,246,.93);padding:10px 12px;
  opacity:0;transition:opacity 180ms var(--corpo)}
.obra:hover figcaption,.obra:focus-visible figcaption{opacity:1}
.obra figcaption b{display:block;font-family:var(--nome);font-size:14px;font-weight:600}
/* a peca aberta, em cima de tudo */
.lupa{position:fixed;inset:0;z-index:30;display:none;place-items:center;
  background:rgba(250,249,246,.97);padding:clamp(16px,4vh,48px);cursor:zoom-out}
.lupa.no{display:grid}
.lupa img{max-width:100%;max-height:82vh;width:auto;height:auto;display:block;margin:0 auto}
.lupa figcaption{font-family:var(--disp);font-size:13px;color:#59544a;
  text-align:center;margin-top:16px;line-height:1.5}
.lupa figcaption b{font-family:var(--nome);font-size:16px;font-weight:600;display:block}
.volta{position:absolute;z-index:3;
  top:clamp(26px,5.6vh,54px);left:clamp(14px,4vw,34px);
  display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;
  font-family:var(--disp);font-size:11px;letter-spacing:.17em;text-transform:uppercase;
  color:#59544a;cursor:pointer}
.volta:hover{color:var(--tinta)}

@media (hover:none){ .palco{cursor:auto} .cursor{display:none} .porta{cursor:pointer} }

@media (prefers-reduced-motion:reduce){
  .cor{-webkit-mask-image:none;mask-image:none}
  .cursor{transition:none}
}
</style>

<div class="pagina">
  <header class="faixa alta">
    <h1>Olivia Kalicinski
      <small>growth · branding · code</small></h1>
  </header>

  <div class="palco" id="palco" style="--mancha:radial-gradient(circle 0px at 50% 50%, #000 58%, transparent 100%)">
    <img class="camada lapis h" src="casa/sala/lapis-h.webp" alt="Olivia's work corner, drawn in pencil">
    <img class="camada cor   h" src="casa/sala/cor-h.webp"   alt="">
    <img class="camada lapis v" src="casa/sala/lapis.webp"   alt="Olivia's work corner, drawn in pencil">
    <img class="camada cor   v" src="casa/sala/cor.webp"     alt="">

    <div class="colado lapis h" id="colado-lapis-h"><div class="mat"><img src="casa/sala/desenho-lapis.png" alt=""></div></div>
    <div class="colado cor   h" id="colado-cor-h"><div class="mat"><img src="casa/sala/desenho-cor.png" alt=""></div></div>
    <div class="colado lapis v" id="colado-lapis-v"><div class="mat"><img src="casa/sala/desenho-lapis.png" alt=""></div></div>
    <div class="colado cor   v" id="colado-cor-v"><div class="mat"><img src="casa/sala/desenho-cor.png" alt=""></div></div>

    <figure class="lupa" id="lupa" aria-hidden="true"><div>
      <img id="lupa-img" src="" alt=""><figcaption id="lupa-ficha"></figcaption></div></figure>
    <article class="dentro" id="dentro" aria-hidden="true">
      <button class="volta" id="volta" type="button">← Back to the room</button>
      <div class="folha">
        <h2 id="dentro-titulo"></h2>
        <div id="dentro-texto"></div>
      </div>
    </article>
  </div>

  <div class="cursor" id="cursor"></div>

  <template id="cv-html">
    <p class="chapeu">Head of Growth @ Comida de Dragão (Lets Fly). Paid acquisition, lifecycle
      and CRO for DTC — and I build the stack too: React, SQL, agent automation.</p>

    <h3>Summary</h3>
    <p>I launched a DTC pet-food brand for a Brazilian insect-protein biotech and I own its
      acquisition P&amp;L — paid media, creators, CRM and CRO — and I build the system that
      runs it.</p>
    <p>In practice:</p>
    <ul>
      <li>I lead a team of four and the company's marketing objective: CAC, checkout close
        rate, cart recovery, 90-day repurchase and winning creator videos.</li>
      <li>I found one ad driving 29 of 63 purchases on 13% of spend. Fixing its destination
        moved the account from 34 to 40 purchases and CPA from R$102 to R$95 in a single week.</li>
      <li>I replaced ROAS with contribution margin per landing page as the budget rule, so
        every page carries its own CPA ceiling.</li>
      <li>I build what I run: 20+ landing pages in a React/TypeScript portal (564 commits),
        dashboards, GA4 tracking and scheduled agent automations.</li>
    </ul>
    <p>Before this: six years at a family-owned cheese company, where I created the trade
      marketing department and built its team — fourteen young women from the town, none with
      previous work experience — and brand management at L'Oréal (Garnier).</p>
    <p>From 2021 to 2025 I worked as a visual artist — ceramics, photography and installation,
      awarded at Festival do Minuto 2024. Not a detour: it is where the eye and the
      storytelling come from.</p>
    <p class="fecho">I'm looking for a remote Head of Growth or Growth Lead role with an
      international team.</p>
    <p class="fecho">Brazilian citizen, based in Rio de Janeiro (GMT-3). I don't hold US work
      authorization and I'm not seeking sponsorship — I work as an independent contractor, or
      through an employer of record (Deel, Remote.com, Oyster).</p>
    <p class="fecho">I hold a valid US visitor visa with 8 years remaining, so retreats and
      on-site meetings need no lead time.</p>

    <h3>Experience</h3>

    <div class="linha">
      <div class="quando">January 2025<br>— present<br>1 yr 10 mos</div>
      <div class="o-que">
        <b>Head of Growth · Lets Fly | Alimento que regenera</b>
        <p class="onde">Rio de Janeiro, Brazil</p>
        <p>Comida de Dragão is the DTC pet-food brand of Lets Fly, a Brazilian biotech that
          converts organic waste into insect protein (Black Soldier Fly). The brand did not
          exist when I arrived. I led it to market, and I own its full acquisition P&amp;L and
          the system that runs it.</p>
        <ul>
          <li>Took the brand to market from zero: led positioning, launch and product
            communication for every product in the catalogue — six products between January
            2025 and October 2026, for dogs, cats, reptiles and amphibians</li>
          <li>Inverted where the company's revenue comes from: in the first four months of
            2025, 87% of it was B2B — a few large contracts that predated me. In the same months
            of 2026, direct-to-consumer and resale are 67%, with B2C up more than tenfold, while
            the old B2B channel shrank 22%</li>
          <li>5,077 buyers and delivery to 598 Brazilian municipalities across 26 states, on
            a Shopify store I run end to end — 15.1% of the base has bought more than once</li>
          <li>Built the creator programme in-house instead of hiring an agency: 2,310 creators
            approached and 233 active partners today, across 25 states, each with a tracked code.
            Read its incremental effect by comparing weeks with and without paid support — coupon
            sales double with media and keep running without it</li>
          <li>Rebuilt the attribution the whole company reads: found the purchase event firing
            on order creation instead of payment, which inflated every platform ROAS by about 12%
            (measured across 250 orders: 10% cancelled, 2% refunded), and found the Meta click id
            being dropped between domains, so only 57% of purchases came back identified. Both

const palco=document.getElementById('palco');
const R=()=>Math.min(palco.clientWidth,palco.clientHeight)*0.26;
function mancha(xp,yp,r){
  palco.style.setProperty('--mancha',
    `radial-gradient(circle ${r}px at ${xp}% ${yp}%, #000 58%, transparent 100%)`);
}
const cursor=document.getElementById('cursor');
function onde(e){
  const b=palco.getBoundingClientRect();
  mancha(((e.clientX-b.left)/b.width)*100, ((e.clientY-b.top)/b.height)*100, R());
  cursor.style.setProperty('--x', e.clientX+'px');
  cursor.style.setProperty('--y', e.clientY+'px');
  cursor.classList.add('on');
  /* abre quando estiver sobre algo que leva a algum lugar */
  const alvo=document.elementFromPoint(e.clientX,e.clientY);
  cursor.classList.toggle('porta', !!(alvo && alvo.closest('[data-porta]')));
}
/* clicar numa obra abre ela grande; clicar de novo fecha */
document.addEventListener('click', e=>{

  if(e.target.closest('.lupa')){ lupa.classList.remove('no'); lupa.setAttribute('aria-hidden','true'); }
});
addEventListener('keydown', e=>{ if(e.key==='Escape') lupa.classList.remove('no'); });
palco.addEventListener('pointermove', onde);
palco.addEventListener('pointerdown', onde);
palco.addEventListener('pointerleave', ()=>{ mancha(50,50,0); cursor.classList.remove('on'); });

    'Comida de Drag\u00e3o is a Brazilian pet-food brand made from insect protein: the parent company raises black soldier fly larvae on organic waste and turns them into food for dogs, cats and reptiles. Nearly everyone in that industry sells B2B. Selling it straight to the people who own the animals is a category that did not exist here.',
    'In January 2025, when I arrived, 87% of the company\u2019s revenue came from a handful of those B2B contracts. Today direct-to-consumer and resale are two thirds of it. I built that route \u2014 the brand did not exist, and I led it to market.',

    'What I am proudest of is measurement I fixed rather than growth I claimed.',
    'The purchase event was firing when an order was created, not when it was paid. Every platform ROAS in the company was inflated by about 12% \u2014 measured across 250 orders: 10% cancelled, 2% refunded.',
    'The Meta click id was being dropped in the jump between domains, so only 57% of purchases came back identified; the rest returned as modelling. About 35% of landing-page traffic was not human \u2014 desktop sessions lasting just over a second, converting at zero, dragging down the denominator of every page. And the source of a sale was frozen at the first click and never overwritten, so the channel spending the money always looked smaller than it was.',
    'One channel died for 75 days without an error anywhere. A platform migration stopped the shop emitting its \u201corder complete\u201d event, and the review tool was waiting on that event to fire fourteen days later. It sent nothing, received nothing, and every dashboard said \u201cenabled\u201d. That became a standing rule: configured and working are different claims, and only the counter settles it.',
    'The creator programme is built in-house, with no agency: 2,310 creators approached, 233 active partners today, across 25 states. Measuring it taught me two things. The channel grows by width, not height \u2014 each creator sells one to three times a week, steadily, and it tripled when four people selling became sixteen, not because anyone got better. And counting it by coupon underestimated it by an order of magnitude: one creator had 107 purchases attributed on the platform against 26 orders carrying her code.',
    'I replaced return on ad spend with contribution margin per landing page as the budget rule, so each page carries its own cost ceiling, drawn from its real ticket rather than its list price. Under the right ceiling, an ad that had been dismissed as too expensive turned out to be the second most profitable in the account.',

    'My practice explores the relationships between time, society and consumption, proposing a dialogue between the primitive and the contemporary. It works through installation, printmaking, sculpture and photography, and it investigates the cycles of life, death and life \u2014 impermanence, transformation, and the impact of human choices.',
    'We live busy, interconnected, overwhelmed by endless stimuli. We consume objects, images and information at an unrelenting pace, leaving behind traces that accumulate without much thought. In the rush we lose sight of ourselves, of each other, and of the natural world around us.',
    'The installations are built from raw ceramic tiles assembled like a painting, each one carrying what we throw away: dead insects, remote-control buttons, cable plugs, computer chips. One of them holds banana peels caught at different stages of decomposition, alongside wires and fragments of obsolete objects. In the engravings, the waste is pressed into the clay before it is fired.',
    'The clay is ancestral \u2014 moulded and fired in open pits \u2014 and what it carries is contemporary. In photography I capture the same tension: nature against culture, the organic and the artificial coexisting in contrast.',

  dentro.classList.toggle('revista', !d.molde);
  dentro.classList.toggle('com-galeria', !!(d.galeria||d.longo));
  dentro.querySelector('.folha').classList.toggle('larga', !!d.larga);
  dentro.classList.add('no'); dentro.setAttribute('aria-hidden','false');
  document.querySelector('.pagina').classList.add('lendo');
  dentro.scrollTop=0;
  document.getElementById('volta').focus();
}
function fechaDentro(){
  document.querySelector('.pagina').classList.remove('lendo');
  dentro.classList.remove('no'); dentro.setAttribute('aria-hidden','true');
}
document.getElementById('volta').addEventListener('click', fechaDentro);
document.getElementById('link-cv').addEventListener('click', e=>{ e.preventDefault(); abreDentro('cv'); });
addEventListener('keydown', e=>{ if(e.key==='Escape') fechaDentro(); });

/* ---- as portas: caixa em % da IMAGEM, não do palco ---- */
const MIOLO={ h:{x:32.25,y:26.15,w:4.55,h:7.4}, v:{x:20.6,y:34.05,w:6.8,h:5.7} };
const PORTAS={
  v:[ {id:'codigo',  x:40,y:44,w:20,h:13, nome:'Work',        lado:'cima'},
      {id:'farm',    x:35,y:15,w:24,h:26, nome:'Farm',        lado:'esq'},
      {id:'arte',    x:30.6,y:34.8,w:7.2,h:6.1,nome:'Art',      lado:'baixo'},
      {id:'arte',    x:2, y:42,w:13,h:12, nome:'Art',         lado:'dir'},
      {id:'arte',    x:48,y:55,w:9, h:6,  nome:'Art',        lado:'baixo'},
      {id:'metodo',  x:63,y:55,w:7, h:3.2,nome:'Method',      lado:'esq'},
      {id:'joaquim', x:18.8,y:33,w:10.4,h:7.8,nome:'Joaquim',   lado:'dir'},
      {id:'eu',      x:28,y:56,w:22,h:26, nome:'Olivia',      lado:'dir'} ],
  h:[ {id:'codigo',  x:46.5,y:37.5,w:17, h:14, nome:'Work',        lado:'cima'},
      {id:'farm',    x:44, y:5,   w:17, h:30,  nome:'Farm',        lado:'esq'},
      {id:'arte',    x:39.3,y:27.2,w:4.5,h:7.6, nome:'Art',         lado:'baixo'},
      {id:'arte',    x:21.5,y:35, w:7,  h:12,  nome:'Art',         lado:'dir'},
      {id:'arte',    x:54, y:50.3,w:5.5,h:5,   nome:'Art',        lado:'baixo'},
      {id:'metodo',  x:62, y:52,  w:7,  h:4,   nome:'Method',      lado:'esq'},
      {id:'joaquim', x:31,  y:24.8,w:6.8, h:10.2,nome:'Joaquim',   lado:'cima'},
      {id:'eu',      x:36.5,y:52, w:17, h:31,  nome:'Olivia',      lado:'dir'} ]
};
function orientacao(){ return matchMedia('(max-aspect-ratio:1/1)').matches ? 'v' : 'h'; }
function imagemVisivel(){ return palco.querySelector('.lapis.'+orientacao()); }

/* com object-fit:contain a imagem é menor que o palco: achar a caixa real */
function caixaDaImagem(){
  const im=imagemVisivel(), p=palco.getBoundingClientRect();
  const rw=im.naturalWidth||1024, rh=im.naturalHeight||1536;
  const k=Math.min(p.width/rw, p.height/rh);
  const w=rw*k, h=rh*k;
  return {x:(p.width-w)/2, y:(p.height-h)/2, w, h};
}
function desenhaPortas(){
  palco.querySelectorAll('.porta').forEach(n=>n.remove());
  const c=caixaDaImagem();
  PORTAS[orientacao()].forEach(p=>{
    const b=document.createElement('button');
    b.className='porta'; b.dataset.porta=p.id; b.type='button';
    b.style.left   = (c.x + c.w*p.x/100)+'px';
    b.style.top    = (c.y + c.h*p.y/100)+'px';
    b.style.width  = (c.w*p.w/100)+'px';
    b.style.height = (c.h*p.h/100)+'px';
    b.innerHTML='<span class="cartao '+(p.lado||'cima')+'"><b>'+p.nome+'</b></span>';
    b.setAttribute('aria-label', p.nome);
    b.addEventListener('click', ()=>abreDentro(p.id));
    palco.appendChild(b);
  });
  posicionaColado(c);
  palco.style.setProperty('--artw', c.w+'px');
  palco.style.setProperty('--arth', c.h+'px');
}
/* o miolo do quadro, em % da imagem: tapa o desenho que estava ali */
function posicionaColado(c){
  const o=orientacao(), m=MIOLO[o];
  palco.querySelectorAll('.colado.'+o+' .mat').forEach(el=>{
    el.style.left   = (c.x + c.w*m.x/100)+'px';
    el.style.top    = (c.y + c.h*m.y/100)+'px';
    el.style.width  = (c.w*m.w/100)+'px';
    el.style.height = (c.h*m.h/100)+'px';
  });
}
/* enquanto o desenho nao existir, a folha e a porta ficam fora da sala */
function semDesenho(im){
  im.parentNode.classList.add('vazio');
  ['h','v'].forEach(o=>{ const i=PORTAS[o].findIndex(d=>d.id==='joaquim'); if(i>=0) PORTAS[o].splice(i,1); });
  palco.querySelectorAll('.porta[data-porta="joaquim"]').forEach(n=>n.remove());
}
palco.querySelectorAll('.colado .mat img').forEach(im=>{
  if(im.complete && !im.naturalWidth) semDesenho(im);
  else im.addEventListener('error', ()=>semDesenho(im));
});
if(location.hash==='#marcadas') palco.classList.add('marcadas');
addEventListener('resize', desenhaPortas);
imagemVisivel().complete ? desenhaPortas() : imagemVisivel().addEventListener('load', desenhaPortas);
addEventListener('load', desenhaPortas);

/* no celular não há dedo pairando: a sala visita um objeto de cada vez,
   acende a cor nele e abre a moldura para a pessoa apertar */
if(!matchMedia('(hover:hover)').matches || location.hash.startsWith('#toque')) addEventListener('load', ()=>{
  const suave = t => 1-Math.pow(1-t,4);     /* power4.out, a régua da casa */
  const MOVE=530, PAUSA=2100;               /* 16 quadros para andar, dois segundos parado */
  let i=-1, de={x:50,y:50}, para={x:50,y:50}, t0=0, aberta=null, laco=0;
  const fixo=(location.hash.match(/#toque=(\d+)/)||[])[1];   /* só para conferência */
  if(fixo!==undefined) i=parseInt(fixo)-1;

  function centroDe(p){
    const c=caixaDaImagem(), b=palco.getBoundingClientRect();
    return { x:(c.x + c.w*(p.x+p.w/2)/100)/b.width*100,
             y:(c.y + c.h*(p.y+p.h/2)/100)/b.height*100 };
  }
  function proxima(agora){
    const ps=PORTAS[orientacao()];
    i=(i+1)%ps.length;
    de={x:para.x,y:para.y}; para=centroDe(ps[i]); t0=agora;
    if(aberta) aberta.classList.remove('aberta');
    aberta=palco.querySelector('.porta[data-porta="'+ps[i].id+'"]');
  }
  function fecha(){ if(aberta){ aberta.classList.remove('aberta'); aberta=null; } }

  function anda(agora){
    if(!t0) proxima(agora);
    const dt=fixo!==undefined ? MOVE : agora-t0;
    if(dt<MOVE){
      const k=suave(dt/MOVE);
      mancha(de.x+(para.x-de.x)*k, de.y+(para.y-de.y)*k, R()*0.95);
    }else{
      mancha(para.x, para.y, R()*0.95);
      if(aberta) aberta.classList.add('aberta');
      if(dt>MOVE+PAUSA && fixo===undefined) proxima(agora);
    }
    laco=requestAnimationFrame(anda);
  }
  function siga(){ if(!laco){ t0=0; laco=requestAnimationFrame(anda); } }
  function pare(){ cancelAnimationFrame(laco); laco=0; fecha(); }
  siga();

  /* uma caixa de cada vez: quando um ponteiro entra, a visita para na hora,
     para não ficar a caixa da visita mais a caixa do objeto apontado */
  palco.addEventListener('pointermove', e=>{ if(e.pointerType!=='touch') pare(); });
  palco.addEventListener('mousemove', pare);
  palco.addEventListener('pointerdown', e=>{
    const alvo = e.target.closest ? e.target.closest('.porta') : null;
    pare();
    if(alvo){ alvo.classList.add('aberta'); aberta=alvo; } else siga();
  });
});
</script>
